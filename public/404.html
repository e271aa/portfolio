<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>404 | Ruben Martins</title>
    <link rel="icon" href="/favicon.svg?v=3" type="image/svg+xml" />
    <style>
      :root { color-scheme: dark light; --bg: #0a0a0a; --text: #e8e8e8; --mute: #8a8a8a; --accent: #00ff88; }
      @media (prefers-color-scheme: light) { :root { --bg: #f6f5f0; --text: #1a1a1a; --mute: #5a5a5a; --accent: #606b52; } }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--text); font-family: ui-monospace, "Fira Code", Menlo, monospace; }
      main { max-width: 520px; }
      .code { color: var(--accent); font-size: 14px; }
      h1 { font-size: clamp(44px, 12vw, 72px); margin: 8px 0 12px; line-height: 1; }
      p { color: var(--mute); line-height: 1.6; margin: 0 0 6px; }
      a { color: var(--accent); }
      a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <p class="code">$ cd página-que-não-existe</p>
      <h1>404</h1>
      <p>Esta página não existe. Pode ter mudado de sítio.</p>
      <p lang="en">This page does not exist. It may have moved.</p>
      <p style="margin-top: 20px"><a href="/">← ruben.martins</a></p>
    </main>
  </body>
</html>
